# Preview of what is on main, before it goes anywhere near the Pi.
#
# Why this exists: a frontend rebuild on the Pi 2B takes 5-25 minutes, and
# until it finishes there is no way to see whether main actually looks
# right. This publishes the same commit as a demo build you can open on
# the tablet first, so a layout mistake costs a click rather than a build.
#
# It is a DEMO build (VITE_DEMO=true): telemetry is simulated, there is no
# backend, and nothing here touches the van. Demo mode also switches the
# router to HashRouter, which is what makes this work on Pages at all -
# Pages cannot rewrite unknown paths, so a BrowserRouter build would 404
# on any hard load of /power.
name: Pages preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; a half-finished preview is worse than a
# slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Build demo bundle for Pages
        working-directory: frontend
        env:
          VITE_DEMO: 'true'
          # Pages serves from /<repo>/, so assets must carry that prefix.
          # Unset for the Pi's build, which stays at '/'.
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
