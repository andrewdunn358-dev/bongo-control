name: Apply Issue 46 Stage 1 patch

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == '_stage1-transfer'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout transfer branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: _stage1-transfer

      - name: Rebuild exact patch
        shell: bash
        run: |
          set -euo pipefail
          cat _stage1_patch_text/chunk00.txt \
              _stage1_patch_text/chunk01.txt \
              _stage1_patch_text/chunk02.txt \
              _stage1_patch_text/chunk03.txt \
              _stage1_patch_text/chunk04.txt \
              _stage1_patch_text/chunk05.txt \
              _stage1_patch_text/chunk06.txt \
              _stage1_patch_text/chunk07.txt \
              _stage1_patch_text/chunk08.txt \
              _stage1_patch_text/chunk09.txt \
              _stage1_patch_text/chunk10.txt \
              _stage1_patch_text/chunk11.txt > /tmp/issue-46-stage1.patch
          test `wc -c < /tmp/issue-46-stage1.patch` -eq 95412

      - name: Apply the four commits to the requested branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git fetch origin issue-46-stage1-one-theme || true

          git switch -C issue-46-stage1-one-theme origin/main
          git am --3way /tmp/issue-46-stage1.patch

          git push --force-with-lease origin issue-46-stage1-one-theme
