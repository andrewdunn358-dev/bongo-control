# Builds the image the Pi runs, so the Pi does not have to.
#
# Measured on the Pi 2 before this existed, one frontend deploy: npm ci
# 286s, vite build 547s, plus writing the image to the SD card - every
# time the frontend changed. Built here instead, the Pi downloads the
# finished image, and only the layers that changed: a frontend change is
# a couple of MB.
#
# BACKEND TOO, since 2 Oct 2026. It used to be frontend-only on the
# grounds that the backend rarely changes and only its last cheap layers
# rebuild on the Pi. That held only while the Pi's build cache survived:
# after unclean power cycles the cache was gone and a one-file backend
# change became a 30+ minute rebuild on the Pi (apt ~10 min unpacking
# ffmpeg's dependencies, pip, compiling lg). Over the van's 5G MiFi
# (~66 Mbps) even a full first download of the backend image is a minute
# or two, and after that only changed layers come down. The Pi now never
# compiles anything: `docker compose pull` and `up -d`.
#
# ONLY AFTER THE SAFETY GATE PASSES. This runs when "Safety gate" finishes
# on main, and only if it succeeded, building exactly the commit that was
# checked - so a change that fails CI can never become the image the van
# pulls.

name: Build Pi images

on:
  workflow_run:
    workflows: ["Safety gate"]
    types: [completed]
    branches: [main]
  # Manual run, e.g. to rebuild after a base image update.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: pi-images
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend image (linux/arm/v7)
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit the Safety gate checked, not whatever main is now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Only the small nginx stage runs as the Pi's architecture; the
      # build stage runs natively (see docker/frontend.Dockerfile).
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend.Dockerfile
          # Raspberry Pi 2: 32-bit ARMv7.
          platforms: linux/arm/v7
          push: true
          tags: |
            ghcr.io/andrewdunn358-dev/bongo-control-frontend:latest
            ghcr.io/andrewdunn358-dev/bongo-control-frontend:${{ github.event.workflow_run.head_sha || github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha || github.sha }}
          # Reused between runs, so unchanged layers keep the same digest
          # and the Pi never re-downloads them.
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  backend:
    name: Backend image (linux/arm/v7)
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # The whole backend image is ARMv7 (apt, pip from piwheels, the lg
      # C build), so all of it runs under QEMU here. Slow on GitHub -
      # tens of minutes on a cold cache - but that is GitHub's time, not
      # the van's; the gha cache below makes later runs only rebuild the
      # layers that changed.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend.Dockerfile
          platforms: linux/arm/v7
          push: true
          tags: |
            ghcr.io/andrewdunn358-dev/bongo-control-backend:latest
            ghcr.io/andrewdunn358-dev/bongo-control-backend:${{ github.event.workflow_run.head_sha || github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
