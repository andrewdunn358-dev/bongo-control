<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a1628" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#eef2f7" media="(prefers-color-scheme: light)" />
    <meta name="description" content="VanOS — van cockpit for battery, solar, weather, camera and nearby places." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VanOS" />
    <link rel="manifest" href="/manifest.json" />
    <!-- SVG first: browsers that support it get the crisp vector mark at
         any size. The PNG fallbacks are sized deliberately - only the
         simplified vector mark survives 16/32px, so those are rendered
         from it, while apple-touch-icon uses the full artwork because
         iOS shows it large and does not mask it. -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <title>VanOS — Van Cockpit</title>
    <script>
      // Restore theme early to avoid a light-then-dark flash
      (function () {
        try {
          var t = localStorage.getItem('bongo.theme') || 'dark';
          document.documentElement.classList.remove('dark', 'light');
          document.documentElement.classList.add(t === 'light' ? 'light' : 'dark');
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Build id of THIS running app (stamped at build time). Compared
      // against /version.json to notice when the server has a newer build.
      window.__BONGO_BUILD__ = '__BUILD_ID__';

      // Register the offline-shell service worker in production only.
      if ('serviceWorker' in navigator && !/localhost|127\.0\.0\.1/.test(location.hostname) && location.protocol === 'https:') {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/service-worker.js').then(function (reg) {
            // This app is a long-lived SPA: after first load there are no
            // full navigations, so the browser would otherwise never
            // re-check for a new build. On an interval and whenever the
            // app regains focus, (1) ask the SW to re-check itself, and
            // (2) fetch /version.json fresh - if the deployed build id
            // differs from the one baked into this page, a new build is
            // live, so force the update through and reload. Belt and
            // braces so a stale device flips over on its own.
            // Poll for a new deploy, but DON'T force-reload: ask the SW to
            // re-check itself so a changed build installs a new (waiting)
            // worker, which surfaces the in-app "new version" banner. The
            // user reloads when it's safe for them — we never yank the page
            // out from under an active roof-hold or camera view.
            var check = function () {
              reg.update().catch(function () {});
            };
            setInterval(check, 15 * 60 * 1000); // every 15 minutes
            document.addEventListener('visibilitychange', function () {
              if (document.visibilityState === 'visible') check();
            });
            window.addEventListener('focus', check);
          }).catch(function () {});
        });
      }
    </script>
  </body>
</html>
